services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: typit_user
      POSTGRES_PASSWORD: typit_secure_password
      POSTGRES_DB: typit_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typit_user -d typit_production"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://typit_user:typit_secure_password@db:5432/typit_production?pool=10
      SECRET_KEY_BASE: 0cb4e92a83f12456e789a1b2c3d4e5f67890abcdef1234567890abcdef123456
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Map to any port you want on your VPS (e.g. 8080, 3000, 80)
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
